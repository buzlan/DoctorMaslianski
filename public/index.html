<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F5F8FB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Доктор Маслянский" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style id="expo-reset">
      html {
        color-scheme: light;
        background-color: #f5f8fb;
        scrollbar-width: none;
        overscroll-behavior-x: none;
      }
      * {
        scrollbar-width: none;
      }
      *::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
      html,
      body {
        height: 100%;
      }
      body,
      #root,
      #document-scroll {
        background-color: #f5f8fb;
      }
      body {
        overflow: hidden;
        overscroll-behavior-x: none;
        touch-action: pan-y;
      }
      #root,
      #root *,
      #document-scroll,
      #document-scroll * {
        touch-action: pan-y;
      }
      #root [data-allow-pan-x],
      #root [data-allow-pan-x] *,
      #document-scroll [data-allow-pan-x],
      #document-scroll [data-allow-pan-x] * {
        touch-action: pan-x pan-y;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      html[data-page-scroll="document"],
      html[data-page-scroll="document"] body {
        height: auto;
        min-height: 100%;
        overflow: visible;
        background-color: #f5f8fb;
      }
      html[data-page-scroll="document"] #root {
        height: 0;
        min-height: 0;
        overflow: hidden;
        flex: none;
      }
      html[data-page-scroll="document"] #document-scroll {
        min-height: 100%;
        background-color: #f5f8fb;
      }
      #boot-splash {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        z-index: 2000;
        margin: 0;
        background-color: #f5f8fb;
        pointer-events: auto;
      }
      #boot-splash img {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        opacity: 0;
      }
      #boot-splash img.is-ready {
        opacity: 1;
      }
      /* iOS 27 standalone blurs the header unless a solid bar sits on the top edge. */
      #status-bar-fill {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 8px;
        background-color: #f5f8fb;
        pointer-events: none;
        z-index: 1;
      }
    </style>
    <script>
      (function () {
        var path = location.pathname.replace(/\/$/, "") || "/";
        if (path === "/" || path === "/treatment" || path === "/diary") {
          document.documentElement.dataset.pageScroll = "document";
        }

        var startX = 0;
        var startY = 0;
        var blockSwipe = false;
        function allowsHorizontalPan(node) {
          var current = node;
          while (current && current !== document.documentElement) {
            if (current.hasAttribute && current.hasAttribute("data-allow-pan-x")) {
              return true;
            }
            var action = current.style && current.style.touchAction;
            if (action && action.indexOf("pan-x") !== -1) {
              return true;
            }
            current = current.parentElement;
          }
          return false;
        }
        document.addEventListener(
          "touchstart",
          function (event) {
            if (event.touches.length !== 1) {
              blockSwipe = false;
              return;
            }
            var target = event.target;
            if (allowsHorizontalPan(target)) {
              blockSwipe = false;
              return;
            }
            startX = event.touches[0].clientX;
            startY = event.touches[0].clientY;
            blockSwipe = true;
          },
          { passive: true },
        );
        document.addEventListener(
          "touchmove",
          function (event) {
            if (!blockSwipe || event.touches.length !== 1) {
              return;
            }
            var dx = event.touches[0].clientX - startX;
            var dy = event.touches[0].clientY - startY;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) {
              event.preventDefault();
            }
          },
          { passive: false },
        );
      })();
    </script>
  </head>
  <body>
    <div id="status-bar-fill" aria-hidden="true"></div>
    <div id="boot-splash" aria-hidden="true">
      <img src="/splash-screen.png" alt="" decoding="async" fetchpriority="high" onload="this.classList.add('is-ready')" onerror="this.remove()" />
    </div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="document-scroll"></div>
    <div id="root"></div>
  </body>
</html>
