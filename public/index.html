<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F5F8FB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Доктор Маслянский" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style id="expo-reset">
      html {
        color-scheme: light;
        background-color: #f5f8fb;
      }
      html,
      body {
        height: 100%;
      }
      body,
      #root,
      #document-scroll {
        background-color: #f5f8fb;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      html[data-page-scroll="document"],
      html[data-page-scroll="document"] body {
        height: auto;
        min-height: 100%;
        overflow: visible;
        background-color: #f5f8fb;
      }
      html[data-page-scroll="document"] #root {
        height: 0;
        min-height: 0;
        overflow: hidden;
        flex: none;
      }
      html[data-page-scroll="document"] #document-scroll {
        min-height: 100%;
        background-color: #f5f8fb;
      }
      #boot-splash {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 2000;
        margin: 0;
        background-color: #f5f8fb;
        pointer-events: auto;
      }
      #boot-splash img {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
      }
    </style>
    <script>
      (function () {
        var path = location.pathname.replace(/\/$/, "") || "/";
        if (path === "/" || path === "/treatment" || path === "/diary") {
          document.documentElement.dataset.pageScroll = "document";
        }
      })();
    </script>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <img src="/splash-screen.png" alt="" decoding="async" fetchpriority="high" />
    </div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="document-scroll"></div>
    <div id="root"></div>
  </body>
</html>
