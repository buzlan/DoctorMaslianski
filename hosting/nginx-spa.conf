# SPA fallback for the Expo web export (`web.output: "single"`).
# Not deployed. Apply only after an explicit hosting confirmation.
#
# Real files (JS, CSS, images, favicon) are served as themselves.
# Application routes such as /invite/<token> fall through to index.html.

server {
  listen 443 ssl;
  server_name app.maslianski.by;

  root /var/www/doctor-maslianski;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
